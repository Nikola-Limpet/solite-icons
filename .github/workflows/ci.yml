name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        react: ["18.2.0", "19.2.8"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --ignore-scripts --no-save --package-lock=false react@${{ matrix.react }} react-dom@${{ matrix.react }}
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run

  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node node_modules/playwright/cli.js install --with-deps chromium
      - run: npm run check
      - run: npm run test:browser

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
      - run: npm ci
      - run: npm --prefix website ci
      - run: npm run docs:candidate
      - run: npm --prefix website run build
      - run: npm --prefix website run typecheck
      - uses: actions/upload-artifact@v4
        with:
          name: solite-icons-docs
          path: website/out

  publish:
    name: Publish npm
    needs: [validate, accessibility, docs]
    if: >-
      github.event_name == 'push' &&
      github.repository == 'Nikola-Limpet/solite-icons' &&
      (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-publish-solite-icons
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          registry-url: https://registry.npmjs.org
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.21.1 --ignore-scripts
      - run: npm ci --ignore-scripts
      - name: Publish eligible version through npm OIDC
        run: node scripts/release.mjs publish
      - name: Retain npm archive and release report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/npm-release/
          if-no-files-found: warn
          retention-days: 14
